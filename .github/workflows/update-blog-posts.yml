name: Update latest blog posts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch blog source
        uses: actions/checkout@v4
        with:
          repository: ham0806/blog
          ssh-key: ${{ secrets.BLOG_REPO_DEPLOY_KEY }}
          path: .blog-source
          persist-credentials: false

      - name: Update README
        shell: bash
        run: node scripts/update-blog-posts.js

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet README.md; then
            echo "No blog updates"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update latest blog posts"
          git push
